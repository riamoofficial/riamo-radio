<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Riamo Radio International : écoute les radios du Maroc, de France et du monde en direct.">
<meta name="monetag" content="2cd1c8939ae08586c3577c83d60b1a6d">
<title>Riamo Radio International</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:linear-gradient(#0b1020,#10182f);color:#fff;font-family:system-ui,Arial,sans-serif;padding:10px 10px 260px;min-height:100vh}
.ice{font-family:'Orbitron',system-ui,sans-serif;font-weight:800;letter-spacing:1px;background:linear-gradient(180deg,#fff 0%,#bdf1ff 40%,#4db8ee 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px #7fdcff)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top img{width:44px;height:44px;border-radius:50%;border:2px solid #9be7ff;box-shadow:0 0 12px #7fdcff88}
.top .ice{font-size:15px;line-height:1.15}
.pays{display:flex;gap:8px;margin-bottom:8px}
.pays button{flex:1;padding:9px;border:1px solid #9be7ff55;border-radius:20px;background:#17213d;color:#fff;font-size:14px}
.pays button.on{background:linear-gradient(135deg,#dff7ff,#7fdcff);color:#0b1020;font-weight:700}
input,select{width:100%;padding:11px;border-radius:12px;border:1px solid #9be7ff55;background:#17213d;color:#fff;font-size:15px;margin-bottom:8px}
#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.t{background:#17213d;border-radius:10px;padding:4px;text-align:center;min-width:0;cursor:pointer}
.t.on{outline:2px solid #7fdcff}
.im{aspect-ratio:1/1;width:100%;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#0b1020;font-size:22px;font-weight:700;overflow:hidden}
.im img{max-width:90%;max-height:90%;object-fit:contain}
.n{font-size:11px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.e{grid-column:1/-1;text-align:center;color:#8f9ab0}
#soc{display:none;text-align:center}
#soc h2{font-size:20px;margin:14px 0 6px}
#soc h3{font-size:14px;margin:22px 0 10px;color:#9be7ff}
#soc p{color:#aab3c5;font-size:14px;margin:0 0 16px}
#soc a{display:block;max-width:420px;margin:0 auto 10px;padding:15px;border-radius:14px;color:#fff;font-weight:700;font-size:16px;text-decoration:none}
#soc a.m{background:#17213d;border:1px solid #9be7ff44;font-size:14px;padding:12px;font-weight:600}
#dock{position:fixed;left:0;right:0;bottom:0;background:#0b1020;border-top:1px solid #9be7ff44;padding-bottom:env(safe-area-inset-bottom,0px)}
#strip{display:flex;gap:8px;overflow-x:auto;padding:8px 10px;scrollbar-width:none}
#strip::-webkit-scrollbar{display:none}
#strip .c{flex:0 0 auto;width:56px;text-align:center;cursor:pointer}
#strip .im{border-radius:50%;font-size:18px}
#strip .n{font-size:10px}
#bar{background:#0d5fd6;padding:8px 12px;display:flex;align-items:center;gap:8px}
#bar .i{flex:1;min-width:0}
#pn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ps{font-size:12px;opacity:.9}
#bar button{width:44px;height:44px;border-radius:50%;border:0;font-size:20px;background:#fff;color:#0d5fd6}
#bar button.s{background:transparent;color:#fff;font-size:24px;width:40px}
#nav{display:flex;background:#0b1020}
#nav button{flex:1;padding:10px 2px;border:0;background:none;color:#8f9ab0;font-size:11px}
#nav button b{display:block;font-size:20px;font-weight:400}
#nav button.on{color:#7fdcff}
</style></head><body>
<div class="top"><img src="icon-192.png" alt="Riamo Radio"><div class="ice">RIAMO RADIO<br>INTERNATIONAL</div></div>
<div class="pays"><button id="pMA" class="on" onclick="setC('MA')">🇲🇦 Maroc</button><button id="pFR" onclick="setC('FR')">🇫🇷 France</button></div>
<input id="q" placeholder="🔍 Rechercher une radio" oninput="render()">
<select id="st" style="display:none" onchange="render()"></select>
<select id="wc" style="display:none" onchange="load()">
<option value="DZ">🇩🇿 Algérie</option><option value="TN">🇹🇳 Tunisie</option><option value="EG">🇪🇬 Égypte</option><option value="SN">🇸🇳 Sénégal</option><option value="CI">🇨🇮 Côte d'Ivoire</option><option value="BE">🇧🇪 Belgique</option><option value="CH">🇨🇭 Suisse</option><option value="CA">🇨🇦 Canada</option><option value="GB">🇬🇧 Royaume-Uni</option><option value="US">🇺🇸 États-Unis</option><option value="ES">🇪🇸 Espagne</option><option value="DE">🇩🇪 Allemagne</option><option value="IT">🇮🇹 Italie</option><option value="PT">🇵🇹 Portugal</option><option value="SA">🇸🇦 Arabie saoudite</option><option value="AE">🇦🇪 Émirats</option><option value="TR">🇹🇷 Turquie</option>
</select>
<div id="grid"></div>
<div id="soc">
<h2 class="ice">SUIVEZ RIAMO RADIO</h2><p>Retrouvez-nous sur tous nos réseaux</p>
<a style="background:#e62117" href="https://www.youtube.com/@RIAMOradio" target="_blank" rel="noopener">▶ YouTube</a>
<a style="background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)" href="https://www.instagram.com/riamoradio?igsh=eGFqZ2MzbzI5Mmcz" target="_blank" rel="noopener">📸 Instagram</a>
<a style="background:#1877f2" href="https://www.facebook.com/share/1A4W4KcqNR/" target="_blank" rel="noopener">f Facebook</a>
<a style="background:#111;border:1px solid #fff5" href="https://www.tiktok.com/@riamoradio" target="_blank" rel="noopener">♪ TikTok</a>
<a style="background:#111;border:1px solid #fff5" href="https://x.com/Riamoradio" target="_blank" rel="noopener">𝕏 Twitter / X</a>
<a style="background:#fffc00;color:#111" href="https://www.snapchat.com/add/riamoradio?share_id=aQ7sjlsE6eY&locale=fr-FR" target="_blank" rel="noopener">👻 Snapchat</a>
<h3>🌐 AUTRES SITES RIAMO</h3>
<a class="m" href="https://riamo.netlify.app/" target="_blank" rel="noopener">Riamo</a>
<a class="m" href="https://riamoactu.netlify.app/" target="_blank" rel="noopener">Riamo Actu</a>
<a class="m" href="https://riamotools-site.netlify.app/" target="_blank" rel="noopener">Riamo Tools</a>
<a class="m" href="https://github.com/riamoofficial" target="_blank" rel="noopener">GitHub · riamoofficial</a>
</div>
<div id="dock">
<div id="strip"></div>
<div id="bar"><div class="i"><div id="pn">Choisis une radio</div><div id="ps">—</div></div>
<button class="s" id="sl" onclick="sleepT()" title="Minuterie">🌙</button>
<button class="s" id="fv" onclick="togFav()">☆</button><button id="pb" onclick="toggle()">▶</button></div>
<div id="nav">
<button id="tnat" class="on" onclick="setT('nat')"><b>🏠</b>Nationales</button>
<button id="tloc" onclick="setT('loc')"><b>📻</b>Locales</button>
<button id="tmonde" onclick="setT('monde')"><b>🌍</b>Monde</button>
<button id="tfav" onclick="setT('fav')"><b>★</b>Favoris</button>
<button id="tsocial" onclick="setT('social')"><b>📱</b>Réseaux</button>
</div></div>
<audio id="a" preload="none"></audio>
<script>
var $=function(i){return document.getElementById(i)};
var a=$('a'),C='MA',T='nat',L=[],cur=null,fav=[],loaded='',retry=0,slTimer=null,slMin=0;
var SERVERS=['https://de1.api.radio-browser.info','https://fi1.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info'];
try{fav=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
function save(){try{localStorage.setItem('fav',JSON.stringify(fav))}catch(e){}}
function isFav(u){return fav.some(function(f){return f.url===u})}
function api(p){var i=0;function next(){if(i>=SERVERS.length)return Promise.reject();return fetch(SERVERS[i++]+p).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(next)}return next()}
function code(){return T==='monde'?$('wc').value:C}
function setC(c){C=c;$('pMA').className=c==='MA'?'on':'';$('pFR').className=c==='FR'?'on':'';if(T!=='nat'&&T!=='loc')setT('nat');else load()}
function setT(t){T=t;
['nat','loc','monde','fav','social'].forEach(function(k){$('t'+k).className=k===t?'on':''});
var s=t==='social';
$('soc').style.display=s?'block':'none';$('grid').style.display=s?'none':'grid';$('q').style.display=s?'none':'block';
$('st').style.display=t==='loc'?'block':'none';$('wc').style.display=t==='monde'?'block':'none';
if(s){window.scrollTo(0,0);return}
if(t==='fav'){render();return}
if(loaded!==code())load();else render()}
function load(){$('grid').innerHTML='<p class="e">Chargement…</p>';var cc=code();
api('/json/stations/search?countrycode='+cc+'&hidebroken=true&order=clickcount&reverse=true&limit=400').then(function(r){
var seen={};
L=r.filter(function(s){var k=(s.name||'').trim().toLowerCase();if(!k||!s.url_resolved||s.url_resolved.indexOf('https')!==0||seen[k])return false;seen[k]=1;return true})
.map(function(s){return{name:s.name.trim(),url:s.url_resolved,favicon:s.favicon,state:(s.state||'').trim()}});
loaded=cc;
var c={};L.slice(40).forEach(function(s){if(s.state)c[s.state]=(c[s.state]||0)+1});
var o='<option value="">Toutes les régions</option>';
Object.keys(c).sort().forEach(function(k){var v=k.replace(/["<>&]/g,'');o+='<option value="'+v+'">'+v+' ('+c[k]+')</option>'});
$('st').innerHTML=o;render()}).catch(function(){$('grid').innerHTML='<p class="e">Connexion impossible. Vérifie Internet.</p>'})}
function logo(s,im){var ic=s.favicon;
if(ic&&ic.indexOf('https')===0){var i=new Image();i.src=ic;i.onerror=function(){im.textContent=s.name.charAt(0)};im.appendChild(i)}else im.textContent=s.name.charAt(0)}
function render(){
var g=$('grid');g.innerHTML='';var q=$('q').value.trim().toLowerCase();var items=[];
if(q){var seenU={};items=L.concat(fav).filter(function(s){if(seenU[s.url]||s.name.toLowerCase().indexOf(q)<0)return false;seenU[s.url]=1;return true})}
else if(T==='fav')items=fav;
else if(T==='nat')items=L.slice(0,40);
else if(T==='monde')items=L.slice(0,60);
else{items=L.slice(40);var st=$('st').value;if(st)items=items.filter(function(x){return x.state===st})}
items.forEach(function(s){
var d=document.createElement('div');d.className='t'+(cur&&cur.url===s.url?' on':'');
var im=document.createElement('div');im.className='im';logo(s,im);
var n=document.createElement('div');n.className='n';n.textContent=s.name;
d.appendChild(im);d.appendChild(n);d.onclick=function(){play(s)};g.appendChild(d)});
if(!items.length)g.innerHTML='<p class="e">'+(T==='fav'?'Aucun favori : touche ☆ pendant l\u2019écoute.':'Aucune station.')+'</p>';
strip(items)}
function strip(items){var s=$('strip');s.innerHTML='';s.scrollLeft=0;
items.slice(0,40).forEach(function(x){var c=document.createElement('div');c.className='c';
var im=document.createElement('div');im.className='im';logo(x,im);
var n=document.createElement('div');n.className='n';n.textContent=x.name;
c.appendChild(im);c.appendChild(n);c.onclick=function(){play(x)};s.appendChild(c)})}
var pause=false,pt,sp=$('strip');
['touchstart','mousedown'].forEach(function(e){sp.addEventListener(e,function(){pause=true;clearTimeout(pt)})});
['touchend','mouseup'].forEach(function(e){sp.addEventListener(e,function(){pt=setTimeout(function(){pause=false},3000)})});
setInterval(function(){if(pause)return;if(sp.scrollLeft+sp.clientWidth>=sp.scrollWidth-1)sp.scrollLeft=0;else sp.scrollLeft+=1},40);
function play(s){cur=s;retry=0;$('pn').textContent=s.name;$('ps').textContent='Connexion…';
a.src=s.url;a.play().catch(function(){});$('fv').textContent=isFav(s.url)?'★':'☆';
document.title=s.name+' · Riamo Radio';
if('mediaSession' in navigator){try{
navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'Riamo Radio International',artwork:[{src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
navigator.mediaSession.setActionHandler('play',function(){a.play()});
navigator.mediaSession.setActionHandler('pause',function(){a.pause()});
}catch(e){}}}
function toggle(){if(!cur)return;if(a.paused)a.play().catch(function(){});else a.pause()}
function togFav(){if(!cur)return;if(isFav(cur.url))fav=fav.filter(function(f){return f.url!==cur.url});else fav.push(cur);save();$('fv').textContent=isFav(cur.url)?'★':'☆';if(T==='fav')render()}
function sleepT(){clearTimeout(slTimer);var o=[0,15,30,60];slMin=o[(o.indexOf(slMin)+1)%o.length];
if(slMin){slTimer=setTimeout(function(){a.pause();slMin=0;$('sl').textContent='🌙';$('ps').textContent='Minuterie terminée'},slMin*60000);$('sl').textContent='🌙'+slMin;$('ps').textContent='Arrêt dans '+slMin+' min'}
else{$('sl').textContent='🌙';$('ps').textContent=a.paused?'—':'🔴 En direct'}}
a.onplaying=function(){retry=0;$('ps').textContent='🔴 En direct';$('pb').textContent='⏸'};
a.onpause=function(){$('pb').textContent='▶'};
a.onwaiting=function(){$('ps').textContent='Chargement…'};
a.onerror=function(){
if(cur&&retry<2){retry++;$('ps').textContent='Reconnexion…';var u=cur.url;setTimeout(function(){if(cur&&cur.url===u){a.src=u;a.play().catch(function(){})}},1500);return}
$('ps').textContent='Station indisponible, essaie une autre';$('pb').textContent='▶'};
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js')});
function recon(){if(!cur||a.paused&&!retry)return;retry++;$('ps').textContent='Reconnexion…';var u=cur.url,d=Math.min(1500*retry,10000);setTimeout(function(){if(cur&&cur.url===u){a.src=u;a.play().catch(function(){})}},d)}
a.onerror=recon;
a.onended=recon;
a.onstalled=function(){if(!a.paused)recon()};
window.addEventListener('online',function(){if(cur&&!a.paused)recon()});
a.addEventListener('playing',function(){if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'});
a.addEventListener('pause',function(){if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused'});
load();
</script></body></html>
